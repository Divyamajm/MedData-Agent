[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meddata-agent"
version = "1.0.0"
authors = [
  { name = "Divyam Sharma", email = "divyamajm@gmail.com" },
]
description = "Grounded Healthcare & Housing Discovery Engine with Deterministic SQL Sandbox, LLM Intent Parsing, and Dynamic CSV Profiler"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "altair>=5.0.0",
]

[project.urls]
"Homepage" = "https://meddata-divyam.streamlit.app"
"Repository" = "https://github.com/Divyamajm/MedData-Agent"
"Bug Tracker" = "https://github.com/Divyamajm/MedData-Agent/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
llm = [
    "openai>=1.0.0",
    "google-genai>=0.1.0",
]
