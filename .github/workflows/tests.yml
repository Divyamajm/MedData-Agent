name: MedData AI CI & Evaluation Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Pytest Suites, Verification Batteries & Empirical Evals
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Pytest Suite (Adversarial SQL, Security & API Tests)
        run: |
          pytest -v

      - name: Execute Core 32-Test Verification & 25+ SQL Security Battery
        run: |
          python -m tests.test_suite

      - name: Execute MedData 290-Query Reproducible Evaluation Benchmark
        run: |
          python -m tests.eval_benchmark

      - name: Execute MedData Asynchronous Concurrency Load Benchmark
        run: |
          python -m tests.load_test

      - name: Upload Verification & Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-and-benchmark-logs
          path: |
            docs/verification_run.md
          if-no-files-found: ignore

